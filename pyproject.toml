[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-health"
version = "0.1.0"
description = "Weekday Jira sprint health workbook for the database migration steering committee."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "openpyxl",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["sprint_health*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
